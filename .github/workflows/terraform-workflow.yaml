name: 'Terraform CI/CD - Artifact Registry'

# 🚀 Triggers the workflow only when changes occur in the 'terraform-scripts/' directory
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'terraform-scripts/**' # <-- Path filter updated to your folder
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'terraform-scripts/**'

  # 💡 Optional: Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest

    # Define permissions required for checkout and WIF authentication
    permissions:
      contents: 'read'
      id-token: 'write' # Required for Workload Identity Federation (WIF)

    steps:
      # 1. Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud (using Workload Identity Federation)
      # ⚠️ You MUST set up WIF in your repo secrets and in GCP for this to work.
      # This step generates the short-lived access_token.
      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Replace with your actual WIF provider and Service Account details
          workload_identity_provider: 'projects/12999260081/locations/global/workloadIdentityPools/usermanagement-identitypool/providers/githubprovider'
          service_account: 'usermanagement-gke-admin@usermanagement-474108.iam.gserviceaccount.com'

      # 3. Setup Terraform
      # The setup action will automatically use the GCP credentials provided by the 'auth' step.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # 4. Initialize Terraform (downloads providers, sets up backend)
      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform-scripts # <-- Running command from the new folder

      # 5. Validate Terraform syntax
      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform-scripts

      # 6. Create a Terraform Execution Plan
      # The plan is saved to a file for subsequent use and review.
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan.out
        working-directory: ./terraform-scripts

      # 7. Apply changes (Conditional for safety)
      - name: Terraform Apply (Auto-Apply on main/master push only)
        # 🛡️ This step ensures that 'apply' only runs if the change is merged or pushed
        # directly to the main or master branch, preventing unintended changes from PRs.
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: terraform apply -input=false tfplan.out
        working-directory: ./terraform-scripts


